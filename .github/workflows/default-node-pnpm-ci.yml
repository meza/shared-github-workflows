name: Lint and Test

on:
  workflow_call:
    inputs:
      node-version:
        description: "The version of node to use"
        required: false
        type: string
        default: "latest"
      junit-report-path:
        description: "The path to the JUnit report"
        required: false
        type: string
        default: "reports/junit.xml"
      cobertura-report-path:
        description: "The path to the Cobertura report"
        required: false
        type: string
        default: "reports/coverage/cobertura-coverage.xml"
      cache-name:
        description: "The name to assign to the cache"
        required: false
        type: string
        default: pure-dependencies
    secrets:
      GH_TOKEN:
        required: true
    outputs:
      new-release-published:
        description: "If a new release was published"
        value: ${{ jobs.verify.outputs.new-release-published }}
      new-release-version:
        description: "The version of the new release"
        value: ${{ jobs.verify.outputs.new-release-version }}
      cache-name:
        description: "The cache name used"
        value: ${{ inputs.cache-name }}

jobs:
  verify:
    name: 🔎 Lint and Test
    runs-on: meza-ubuntu-slim
    outputs:
      new-release-published: ${{ steps.get-next-version.outputs.new-release-published }}
      new-release-version: ${{ steps.get-next-version.outputs.new-release-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up node
        uses: meza/action-setup-node-pnpm@a2f4240b2835ddfaeb13b353e996e93832b5f47c # main
        with:
          node-version: ${{ inputs.node-version }}
          cache-name: ${{ inputs.cache-name }}
      - run: pnpm run ci
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/composite@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          junit_files: ${{ inputs.junit-report-path }}
      - name: Code Coverage Report
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
        with:
          json-summary-path: reports/coverage/unit/coverage-summary.json
          json-final-path: reports/coverage/unit/coverage-final.json
      - run: npx semantic-release --dry-run
        id: get-next-version
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - run: echo "Need release? ${{ steps.get-next-version.outputs.new-release-published }}" >> $GITHUB_STEP_SUMMARY
